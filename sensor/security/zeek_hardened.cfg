# ==============================================================================
# NetrIQ Zeek Hardened Configuration (Book of Zeek 9.0.1 Compliance)
# Mitigates vulnerabilities in protocol parsers processing untrusted traffic
# ==============================================================================

# 1. Checksum & Packet Sanity
# Drop malformed packets before full protocol dissection
redef ignore_checksums = F;
redef max_packet_size = 65535;

# 2. Connection & Memory Bounds
# Protect against state exhaustion / connection flood attacks
redef tcp_max_initial_window = 65535;
redef tcp_max_above_hole_without_any_acks = 1048576; # 1MB limit on out-of-order segment memory
redef table_expire_interval = 5 sec;

# 3. Protocol Parser Defense
# Disable legacy or unneeded analyzers that increase attack surface
@load base/frameworks/cluster
@load base/protocols/conn
@load base/protocols/dns
@load base/protocols/http
@load base/protocols/ssl
@load base/protocols/ssh

# Disallow arbitrary script execution from logs
redef Log::default_mail_alarms_interval = 0 hrs;

# 4. Spooling & Sandboxed Permissions
redef Log::default_rotation_interval = 3600 sec;
redef Log::default_rotation_postprocessor_cmd = "/opt/netriq/sensor/scripts/rotate_logs.sh";

